<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StarDrop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #181b28;
            --card-border: #232738;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --rare: #3b82f6;
            --epic: #a855f7;
            --legendary: #eab308;
            --common: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(24, 27, 40, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
        }

        .username {
            font-size: 14px;
            font-weight: 600;
        }

        .balance-card {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            color: var(--accent);
        }

        .balance-card span {
            font-size: 18px;
        }

        .add-stars {
            background: var(--accent);
            color: #000;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            transition: transform 0.1s;
        }

        .add-stars:active {
            transform: scale(0.9);
        }

        /* Main Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 20px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: border-color 0.2s;
        }

        .item-card.rare { border-color: rgba(59, 130, 246, 0.4); }
        .item-card.epic { border-color: rgba(168, 85, 247, 0.4); }
        .item-card.legendary { border-color: rgba(234, 179, 8, 0.4); }

        .item-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .item-price {
            font-size: 13px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.1s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .btn:disabled {
            background: var(--card-border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Upgrade Section */
        .upgrade-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 360px;
            margin: 0 auto;
        }

        .upgrade-slots {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 16px;
        }

        .slot {
            flex: 1;
            background: var(--card-bg);
            border: 2px dashed var(--card-border);
            border-radius: 16px;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 10px;
            text-align: center;
            position: relative;
        }

        .slot.filled {
            border-style: solid;
            border-color: var(--accent);
        }

        .multiplier-selector {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .mult-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s;
        }

        .mult-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .wheel-box {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(#22c55e 0deg 216deg, #ef4444 216deg 360deg);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        .wheel-inner {
            width: 140px;
            height: 140px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid var(--accent);
            z-index: 5;
        }

        /* Profile & Inventory */
        .profile-header {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .empty-inventory {
            grid-column: span 2;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 74px;
            background: rgba(15, 17, 26, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            height: 100%;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item.center-upgrade {
            position: relative;
            top: -12px;
        }

        .nav-item.center-upgrade .upgrade-circle {
            width: 54px;
            height: 54px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--accent-glow);
            color: #000;
            transition: transform 0.1s;
        }

        .nav-item.center-upgrade.active .upgrade-circle {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .nav-item.center-upgrade svg {
            fill: #000;
            width: 26px;
            height: 26px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            width: 90%;
            max-width: 320px;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal h3 {
            font-size: 16px;
            text-align: center;
        }

        .modal-items-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .modal-item-row:active {
            background: rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="userAvatar">U</div>
            <div class="username" id="userName">Player</div>
        </div>
        <div class="balance-card">
            ⭐ <span id="userBalance">500</span>
            <button class="add-stars" onclick="addStars()">+</button>
        </div>
    </div>

    <!-- Main Screens Content -->
    <div class="content">
        <!-- SHOP TAB -->
        <div id="tab-shop" class="tab-content active">
            <h2>Магазин предметов</h2>
            <div class="shop-grid" id="shopGrid">
                <!-- Dynamically filled -->
            </div>
        </div>

        <!-- UPGRADE TAB -->
        <div id="tab-upgrade" class="tab-content">
            <h2>Апгрейд предметов</h2>
            <div class="upgrade-container">
                <div class="upgrade-slots">
                    <div class="slot" id="slotSource" onclick="openSelectModal()">
                        <div class="item-icon">➕</div>
                        <div style="font-size:12px; color:var(--text-muted)">Выберите предмет</div>
                    </div>
                </div>

                <div style="width: 100%;">
                    <div style="font-size: 13px; color:var(--text-muted); margin-bottom: 6px; text-align: center;">Множитель выигрыша</div>
                    <div class="multiplier-selector">
                        <button class="mult-btn active" onclick="setMultiplier(1.5, this)">x1.5 (60%)</button>
                        <button class="mult-btn" onclick="setMultiplier(2.0, this)">x2.0 (45%)</button>
                        <button class="mult-btn" onclick="setMultiplier(3.0, this)">x3.0 (30%)</button>
                        <button class="mult-btn" onclick="setMultiplier(5.0, this)">x5.0 (18%)</button>
                    </div>
                </div>

                <div style="position: relative;">
                    <div class="wheel-pointer"></div>
                    <div class="wheel-box" id="upgradeWheel" style="transform: rotate(0deg);">
                        <div class="wheel-inner">
                            <span id="chanceDisplay" style="font-size: 18px; color: var(--accent);">60%</span>
                            <span style="font-size: 10px; color: var(--text-muted);">ШАНС</span>
                        </div>
                    </div>
                </div>

                <button class="btn" id="startUpgradeBtn" onclick="startUpgrade()" style="padding: 12px; font-size: 15px;" disabled>СДЕЛАТЬ АПГРЕЙД</button>
            </div>
        </div>

        <!-- PROFILE / INVENTORY TAB -->
        <div id="tab-profile" class="tab-content">
            <h2>Профиль и Инвентарь</h2>
            <div class="profile-header">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span id="profileName" style="font-weight:700; font-size: 16px;">Player</span>
                    <span id="profileId" style="font-size:12px; color:var(--text-muted);">ID: 000000</span>
                </div>
                <div class="profile-stats">
                    <div class="stat-box">
                        <div class="stat-value" id="invCount">0</div>
                        <div class="stat-label">Предметов</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="invValue">0 ⭐</div>
                        <div class="stat-label">Ценность</div>
                    </div>
                </div>
            </div>

            <h3 style="font-size: 16px; margin-bottom: 10px;">Инвентарь</h3>
            <div class="inventory-grid" id="inventoryGrid">
                <!-- Dynamically filled -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('shop', this)">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Магазин
        </button>
        <button class="nav-item center-upgrade" onclick="switchTab('upgrade', this)">
            <div class="upgrade-circle">
                <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            </div>
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Профиль
        </button>
    </div>

    <!-- Select Item Modal -->
    <div class="modal-overlay" id="selectModal" onclick="closeSelectModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3>Выберите предмет для апгрейда</h3>
            <div class="modal-items-list" id="modalItemsList">
                <!-- Dynamically filled -->
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp Initialization
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Game State
        let state = {
            balance: 500,
            user: {
                name: tg?.initDataUnsafe?.user?.first_name || "Player",
                id: tg?.initDataUnsafe?.user?.id || 12345678,
                username: tg?.initDataUnsafe?.user?.username || "player"
            },
            inventory: [],
            selectedItem: null,
            multiplier: 1.5,
            chance: 60
        };

        // Shop Catalog
        const shopItems = [
            { id: 1, name: "Кепка Cyber", price: 50, rarity: "common", icon: "🧢" },
            { id: 2, name: "Очки Neon", price: 120, rarity: "common", icon: "🕶️" },
            { id: 3, name: "Кроссовки Boost", price: 250, rarity: "rare", icon: "👟" },
            { id: 4, name: "Худи Star", price: 450, rarity: "rare", icon: "🧥" },
            { id: 5, name: "Кейсы Ключ", price: 800, rarity: "epic", icon: "🔑" },
            { id: 6, name: "Геймпад Pro", price: 1200, rarity: "epic", icon: "🎮" },
            { id: 7, name: "Смартфон X", price: 2500, rarity: "legendary", icon: "📱" },
            { id: 8, name: "Ноутбук Cyber", price: 5000, rarity: "legendary", icon: "💻" }
        ];

        // Load saved state if exists
        function loadGame() {
            const saved = localStorage.getItem('stardrop_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.balance = parsed.balance ?? 500;
                    state.inventory = parsed.inventory ?? [];
                } catch(e) {
                    console.error("Load error", e);
                }
            }
            updateUI();
        }

        function saveGame() {
            localStorage.setItem('stardrop_state', JSON.stringify({
                balance: state.balance,
                inventory: state.inventory
            }));
        }

        // UI Updates
        function updateUI() {
            document.getElementById('userBalance').innerText = state.balance;
            document.getElementById('userName').innerText = state.user.name;
            document.getElementById('userAvatar').innerText = state.user.name.charAt(0).toUpperCase();
            document.getElementById('profileName').innerText = state.user.name;
            document.getElementById('profileId').innerText = `ID: ${state.user.id}`;

            renderShop();
            renderInventory();
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            shopItems.forEach(item => {
                const canBuy = state.balance >= item.price;
                const card = document.createElement('div');
                card.className = `item-card ${item.rarity}`;
                card.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">⭐ ${item.price}</div>
                    <button class="btn" ${canBuy ? '' : 'disabled'} onclick="buyItem(${item.id})">Купить</button>
                `;
                grid.appendChild(card);
            });
        }

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            const invCount = document.getElementById('invCount');
            const invValue = document.getElementById('invValue');

            invCount.innerText = state.inventory.length;
            
            let totalVal = state.inventory.reduce((sum, item) => sum + item.price, 0);
            invValue.innerText = `${totalVal} ⭐`;

            if (state.inventory.length === 0) {
                grid.innerHTML = `<div class="empty-inventory">Инвентарь пуст. Купите предметы в магазине!</div>`;
                return;
            }

            grid.innerHTML = '';
            state.inventory.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `item-card ${item.rarity}`;
                card.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">⭐ ${item.price}</div>
                    <button class="btn" style="background:#ef4444; color:#fff;" onclick="sellItem(${index})">Продать</button>
                `;
                grid.appendChild(card);
            });
        }

        // Actions
        function addStars() {
            state.balance += 100;
            saveGame();
            updateUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function buyItem(id) {
            const item = shopItems.find(i => i.id === id);
            if (!item || state.balance < item.price) return;

            state.balance -= item.price;
            state.inventory.push({ ...item, uniqueId: Date.now() + Math.random() });
            saveGame();
            updateUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function sellItem(index) {
            const item = state.inventory[index];
            state.balance += Math.floor(item.price * 0.8); // 80% price return
            state.inventory.splice(index, 1);
            saveGame();
            updateUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // Navigation Tabs
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            element.classList.add('active');

            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // Upgrade Logic
        function setMultiplier(mult, btn) {
            state.multiplier = mult;
            state.chance = Math.round(60 / mult);
            if (state.chance < 5) state.chance = 5;

            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('chanceDisplay').innerText = `${state.chance}%`;
            
            const wheel = document.getElementById('upgradeWheel');
            const deg = (state.chance / 100) * 360;
            wheel.style.background = `conic-gradient(#22c55e 0deg ${deg}deg, #ef4444 ${deg}deg 360deg)`;
        }

        function openSelectModal() {
            if (state.inventory.length === 0) {
                alert("Ваш инвентарь пуст! Сначала купите предмет в магазине.");
                return;
            }
            const list = document.getElementById('modalItemsList');
            list.innerHTML = '';
            state.inventory.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'modal-item-row';
                row.innerHTML = `
                    <div style="display:flex; align-items:center; gap: 10px;">
                        <span style="font-size:24px;">${item.icon}</span>
                        <div>
                            <div style="font-weight:600; font-size:13px;">${item.name}</div>
                            <div style="font-size:11px; color:var(--accent);">⭐ ${item.price}</div>
                        </div>
                    </div>
                `;
                row.onclick = () => selectItemForUpgrade(index);
                list.appendChild(row);
            });
            document.getElementById('selectModal').classList.add('open');
        }

        function closeSelectModal(e) {
            if (!e || e.target.id === 'selectModal') {
                document.getElementById('selectModal').classList.remove('open');
            }
        }

        function selectItemForUpgrade(index) {
            state.selectedItem = state.inventory[index];
            state.selectedItemIndex = index;
            document.getElementById('selectModal').classList.remove('open');

            const slot = document.getElementById('slotSource');
            slot.className = "slot filled";
            slot.innerHTML = `
                <div class="item-icon" style="margin-bottom:4px;">${state.selectedItem.icon}</div>
                <div style="font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;">${state.selectedItem.name}</div>
                <div style="font-size:11px; color:var(--accent);">⭐ ${state.selectedItem.price}</div>
            `;

            document.getElementById('startUpgradeBtn').disabled = false;
        }

        function startUpgrade() {
            if (!state.selectedItem) return;
            document.getElementById('startUpgradeBtn').disabled = true;

            const wheel = document.getElementById('upgradeWheel');
            const randomRot = 1440 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${randomRot}deg)`;

            setTimeout(() => {
                const success = Math.random() * 100 < state.chance;
                if (success) {
                    const newPrice = Math.round(state.selectedItem.price * state.multiplier);
                    state.selectedItem.price = newPrice;
                    state.selectedItem.name += ` (x${state.multiplier})`;
                    
                    state.inventory[state.selectedItemIndex] = state.selectedItem;
                    alert(`Успех! Предмет улучшен! Новая цена: ${newPrice} ⭐`);
                    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    state.inventory.splice(state.selectedItemIndex, 1);
                    alert("К сожалению, апгрейд не удался. Предмет сгорел.");
                    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }

                state.selectedItem = null;
                const slot = document.getElementById('slotSource');
                slot.className = "slot";
                slot.innerHTML = `
                    <div class="item-icon">➕</div>
                    <div style="font-size:12px; color:var(--text-muted)">Выберите предмет</div>
                `;
                document.getElementById('startUpgradeBtn').disabled = true;
                
                saveGame();
                updateUI();
            }, 3000);
        }

        // Initialize on load
        loadGame();
    </script>
</body>
</html>
